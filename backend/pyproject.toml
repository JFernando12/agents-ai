[project]
name = "agents-ai-backend"
version = "0.1.0"
description = "AI Agents Backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.125.0",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "boto3==1.42.13",
    "PyPDF2==3.0.1",
    "python-multipart==0.0.21",
    "python-dotenv==1.2.1",
    "PyJWT==2.10.1",
    "passlib[bcrypt]==1.7.4",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
